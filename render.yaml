# Deployment configuration for the FastAPI backend on Render
# Docs: https://render.com/docs/web-services
# Set secrets in the Render dashboard (never commit real tokens).

services:
  - type: web
    name: whattheissue-api
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    envVars:
      # Database: SQLite for single ephemeral instance, or Supabase PostgreSQL for persistent cloud storage
      - key: DATABASE_URL
        value: sqlite:///./myopensource.db
      # LLM configuration
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      # GitHub read-only token (raises rate limit from 60 to 5,000 req/hr)
      - key: GITHUB_TOKEN
        sync: false
      # Telegram alerts & background watcher (enable ONLY on 1 always-on instance)
      - key: ENABLE_SCHEDULER
        value: "1"
      - key: ENABLE_TELEGRAM_BOT
        value: "1"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: POLL_INTERVAL_MINUTES
        value: "10"
